[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "enterprise-agentic-vs-chatbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi==0.119.1", "uvicorn==0.38.0", "google-adk==1.18.0",
 "litellm==1.79.1", "pydantic==2.12.3", "SQLAlchemy==2.0.44",
 "opentelemetry-sdk==1.37.0", "streamlit==1.50.0", "httpx==0.28.1"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
