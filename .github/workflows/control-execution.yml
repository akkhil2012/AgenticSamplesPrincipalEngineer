name: Control and execution plane demo
on:
  push:
    branches: [task-03-control-plane-vs-execution-plane]
  pull_request:
    paths: ['agent-control-execution-demo/**', '.github/workflows/control-execution.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-control-execution-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python demo.py
